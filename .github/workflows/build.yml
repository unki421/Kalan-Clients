name: Build Kalan Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Manual Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build project
        run: gradle build

      - name: Prepare JAR artifact
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources.jar' -exec cp {} release/ \;

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalan-Client
          path: release/*.jar
          if-no-files-found: error
          retention-days: 14
